<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1238">
<meta name="description" content="A short interactive quest of Perseus, after the 1981 film Clash of the Titans, narrated by Zeus.">
<title>Clash of the Titans — The Quest of Perseus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --lapis:#0d1a52; --night:#060b26; --gold:#f2c84b; --gold2:#b8860b; --marble:#efe9dc;
  --bronze:#b06a2c; --sea:#1b4f6b; --ink:#f7f0dc; --dim:#c9bf9f;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,"Times New Roman",serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#03050f;color:var(--ink);font-family:var(--serif);overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;max-width:560px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(120% 70% at 50% 0%,#1a2a78 0%,var(--lapis) 45%,var(--night) 100%);
  box-shadow:0 0 60px rgba(242,200,75,.12);overflow:hidden}
@media (min-width:600px){#app{border-left:2px solid #6b5420;border-right:2px solid #6b5420}}
/* top bar */
#top{display:flex;align-items:center;gap:8px;padding:calc(6px + var(--safe-t)) 10px 6px;min-height:68px;
  background:linear-gradient(#0a103a,#0a103acc);border-bottom:2px solid var(--gold2);position:relative;z-index:5}
#chap{flex:1;min-width:0;font-size:clamp(13px,3.6vw,17px);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 8px rgba(242,200,75,.5)}
.icon-btn{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 35% 30%,#2c3c8f,#111a4d);
  color:var(--gold);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:var(--serif)}
.icon-btn:active{transform:scale(.94)}
.icon-btn[hidden]{display:none}
#hintBtn svg{width:40px;height:40px}
/* stage */
#stage{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#flash{position:absolute;inset:0;background:#fff8d8;opacity:0;pointer-events:none;z-index:3}
#flash.on{animation:flash .55s steps(4) 1}
@keyframes flash{0%{opacity:.85}30%{opacity:.1}50%{opacity:.6}100%{opacity:0}}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:rgba(4,7,25,.82);z-index:4;opacity:0;pointer-events:none;transition:opacity .5s;padding:20px}
#card.on{opacity:1;pointer-events:auto}
#card .num{font-size:clamp(30px,9vw,52px);color:var(--gold);text-shadow:0 0 18px rgba(242,200,75,.7)}
#card .name{font-size:clamp(22px,6.4vw,34px);letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
#card .rule{width:60%;height:10px;margin:14px auto;background:
  repeating-linear-gradient(90deg,var(--gold) 0 3px,transparent 3px 9px),linear-gradient(var(--gold),var(--gold));background-size:100% 3px,100% 2px;background-repeat:no-repeat;background-position:0 0,0 100%}
#toast{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:linear-gradient(#1b2466f2,#0c1238f2);border:2px solid var(--gold);
  border-radius:16px;padding:12px 14px 12px 74px;font-size:clamp(16px,4.2vw,19px);line-height:1.35;min-height:76px;display:none}
#toast.on{display:block}
#toast svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:58px;height:58px}
#toast b{color:var(--gold)}
/* dialog */
#dialog{flex:none;position:relative;padding:10px 16px 8px;max-height:36vh;max-height:36dvh;overflow-y:auto;
  background:linear-gradient(180deg,#0b1240f0,#070b2af8);border-top:2px solid var(--gold2);cursor:pointer;min-height:96px}
#speaker{font-size:clamp(13px,3.4vw,16px);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;min-height:1.2em}
#speaker[data-s="THETIS"]{color:#7fe0d0} #speaker[data-s="ATHENA"]{color:#cfd8ff} #speaker[data-s="HERA"]{color:#f0b4ff}
#speaker[data-s="APHRODITE"]{color:#ffb3c4} #speaker[data-s="POSEIDON"]{color:#7fc4ff}
#text{font-size:clamp(18px,4.9vw,24px);line-height:1.42;text-shadow:0 0 10px rgba(242,200,75,.28)}
#text[data-s="ZEUS"]{color:#fff3cf;text-shadow:0 0 12px rgba(242,200,75,.55),0 0 2px #000}
#text .w{opacity:0;display:inline-block;animation:wordIn .45s ease-out forwards;white-space:pre}
#text.done .w{animation:none;opacity:1}
@keyframes wordIn{from{opacity:0;transform:translateY(5px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#text.big{font-size:clamp(28px,8.5vw,44px);text-align:center;letter-spacing:.06em;color:#fff;text-shadow:0 0 18px var(--gold),0 0 4px #000}
#text .sub{font-size:.72em;color:var(--dim);display:block;margin-top:6px}
.title-h{font-size:clamp(30px,9.5vw,50px);text-align:center;letter-spacing:.1em;line-height:1.05;color:var(--gold);
  text-shadow:0 2px 0 #6b4a0c,0 0 22px rgba(242,200,75,.6);margin:4px 0}
.title-s{text-align:center;color:var(--dim);font-size:clamp(14px,3.8vw,18px);letter-spacing:.12em}
/* actions */
#actions{flex:none;display:flex;flex-wrap:wrap;gap:12px;padding:10px 12px calc(12px + var(--safe-b));justify-content:center;
  background:#05081e;min-height:84px;align-content:center}
.btn{flex:1 1 40%;min-height:60px;min-width:120px;padding:10px 14px;border-radius:14px;border:2px solid var(--gold);
  background:linear-gradient(#3a2a08,#1d1504);color:#ffe9a8;font-family:var(--serif);font-size:clamp(17px,4.6vw,21px);letter-spacing:.04em;
  cursor:pointer;box-shadow:0 3px 0 #6b4a0c,0 0 12px rgba(242,200,75,.18);touch-action:manipulation}
.btn:active,.btn.held{transform:translateY(2px);box-shadow:0 1px 0 #6b4a0c}
.btn.primary{background:linear-gradient(#6b4a0c,#3a2806);color:#fff6d0}
.btn.alt{border-color:#7fb0ff;background:linear-gradient(#1a2c6e,#0e173f);color:#dfe8ff;box-shadow:0 3px 0 #0a1238}
.btn.danger{border-color:#ff8a6a;background:linear-gradient(#5a1a10,#2c0c08);color:#ffd9cc}
.btn.full{flex-basis:100%}
.btn:disabled{opacity:.45}
.btn.bolt{font-size:clamp(20px,5.6vw,26px);min-height:70px;animation:pulse 1.6s steps(6) infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 #6b4a0c,0 0 10px rgba(242,200,75,.3)}50%{box-shadow:0 3px 0 #6b4a0c,0 0 28px rgba(242,200,75,.9)}}
.meter{flex-basis:100%;height:18px;border:2px solid var(--gold2);border-radius:10px;overflow:hidden;background:#111;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b8860b,#ffe27a);width:0}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(242,200,75,.35);border-left:2px solid var(--gold);border-right:2px solid var(--gold)}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:#fff;box-shadow:0 0 8px #fff;border-radius:4px}
.status{flex-basis:100%;text-align:center;font-size:clamp(15px,4vw,18px);color:var(--dim);min-height:1.3em}
/* shake */
#app.shake{animation:shake .5s steps(6) 1}
@keyframes shake{0%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}100%{transform:translate(0)}}
/* SVG stop-motion animations */
.tw{animation:tw 2.4s steps(3) infinite} .tw2{animation:tw 3.1s steps(3) infinite .7s}
@keyframes tw{50%{opacity:.25}}
.flap{transform-box:fill-box;transform-origin:10% 90%;animation:flap .48s steps(3) infinite}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg) scaleY(.75)}}
.swivel{transform-box:fill-box;transform-origin:50% 80%;animation:swivel 3.2s steps(4) infinite}
@keyframes swivel{0%,40%{transform:rotate(0)}50%,70%{transform:rotate(-22deg)}80%,92%{transform:rotate(18deg)}}
.snake{transform-box:fill-box;transform-origin:50% 100%;animation:snake .9s steps(3) infinite alternate}
.snake:nth-child(2n){animation-duration:.7s;animation-delay:.2s}
@keyframes snake{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.bob{animation:bob 2.4s steps(5) infinite alternate} @keyframes bob{to{transform:translateY(-9px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 1.8s steps(4) infinite alternate} @keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 2.2s steps(4) infinite alternate} @keyframes wave{to{transform:translateX(-26px)}}
.scroll{animation:scroll 5s steps(20) infinite linear} @keyframes scroll{to{transform:translateX(-400px)}}
.glowp{animation:glowp 1.4s steps(4) infinite alternate} @keyframes glowp{from{opacity:.45}to{opacity:1}}
.flicker{animation:flick .5s steps(3) infinite alternate} @keyframes flick{from{opacity:.65;transform:scaleY(.92)}to{opacity:1}}
.rattle{transform-box:fill-box;transform-origin:0 50%;animation:rat .16s steps(2) infinite} @keyframes rat{50%{transform:rotate(9deg)}}
.tap{cursor:pointer}
.tap-ring{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:8 6;animation:ring 1.2s steps(6) infinite}
@keyframes ring{to{stroke-dashoffset:-28}}
.lunge{transform-box:fill-box;transform-origin:80% 80%;animation:lunge .5s steps(3) 1 forwards}
@keyframes lunge{50%{transform:translate(-6px,-4px) scale(1.18)}100%{transform:scale(1.12)}}
.stone *{fill:#8d8a84 !important;stroke:#5c5a55 !important}
.gone{opacity:0;transition:opacity .6s steps(4)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s !important;animation-iteration-count:1 !important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:640px){#text{font-size:clamp(16px,4.4vw,20px)} #dialog{min-height:80px} .btn{min-height:56px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="chap">Clash of the Titans</div>
    <button id="hintBtn" class="icon-btn" hidden aria-label="Ask Bubo for a hint"></button>
    <button id="muteBtn" class="icon-btn" aria-label="Sound on or off">🔊</button>
  </div>
  <div id="stage">
    <svg id="svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#e2b03a"/><stop offset="1" stop-color="#8a5f10"/></linearGradient>
        <linearGradient id="gMarble" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc6b4"/><stop offset=".45" stop-color="#fbf7ee"/><stop offset="1" stop-color="#b9b09c"/></linearGradient>
        <linearGradient id="gBronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c27a"/><stop offset=".5" stop-color="#b06a2c"/><stop offset="1" stop-color="#5e3412"/></linearGradient>
        <radialGradient id="gShield" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff6d8"/><stop offset=".55" stop-color="#d7a24e"/><stop offset="1" stop-color="#6b3c12"/></radialGradient>
        <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6f8f"/><stop offset="1" stop-color="#081c33"/></linearGradient>
        <radialGradient id="gMoon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe8"/><stop offset=".7" stop-color="#f2e6b8"/><stop offset="1" stop-color="#f2e6b800"/></radialGradient>
        <radialGradient id="gFire" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ff8a1c"/><stop offset="1" stop-color="#ff3a0000"/></radialGradient>
        <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
        <radialGradient id="gSpirit" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8fbff"/><stop offset="1" stop-color="#9fe6ff00"/></radialGradient>
        <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="world"></g>
    </svg>
    <div id="flash"></div>
    <div id="card"><div class="num"></div><div class="rule"></div><div class="name"></div></div>
    <div id="toast" role="status"></div>
  </div>
  <div id="dialog" aria-live="polite"><div id="speaker"></div><div id="text"></div></div>
  <div id="actions"></div>
</div>
<script>
/* =====================================================================
   VOICE CONFIG + VOICE_LINES MANIFEST
   ---------------------------------------------------------------------
   Every spoken line has a stable id. To add recorded narration, put an
   audio file named <id>.mp3 inside an "audio/" folder next to this file
   (e.g. audio/olympus_01.mp3). If a file loads, it plays and the text is
   revealed in time with it. If not, the game silently falls back to
   dramatic text + synthesized thunder and drone.
   - enabled:      set false to never look for recordings.
   - base / ext:   folder and file extension (".mp3", ".ogg", ".m4a"...).
   - giveUpAfter:  if this many files are missing before any file has loaded,
                   stop looking (so a game with no recordings makes just one
                   probe request, for audio/title_01.mp3). If you record only
                   some lines, include title_01, or raise this number.
   - Any line can override its file with an explicit  audio: "path"  field.
   See VOICE_SCRIPT.md for the full recording script with delivery notes.
   ===================================================================== */
const VOICE_CONFIG = { enabled: true, base: "audio/", ext: ".mp3", giveUpAfter: 1, volume: 1.0 };

const VOICE_LINES = {
  // ---- Title ----
  title_01:{speaker:"ZEUS",text:"Mortal, you stand at the gates of Olympus. Come. Witness the clash of gods and Titans.",note:"Slow, vast, welcoming. Let each sentence land like a footstep on marble.",fx:"shake"},
  // ---- I. The Arena of Life ----
  olympus_01:{speaker:"ZEUS",text:"Hear me, son of Danaë! The Fates have woven your thread, and I, Zeus, shall not let it fray.",note:"Proud father, booming. Rise on 'I, Zeus'.",fx:"shake"},
  olympus_02:{speaker:"ZEUS",text:"Behold the Arena of Life. Here every mortal stands as a figure of clay, and here I move them as I will.",note:"Calm, absolute authority. Unhurried."},
  olympus_03:{speaker:"ZEUS",text:"King Acrisius sealed my son and his mother in a chest and gave them to the sea. For that cruelty I loosed the Kraken, last of the Titans, and Argos is no more.",note:"Cold fury, then grim finality on 'Argos is no more'.",fx:"shake"},
  olympus_04:{speaker:"ZEUS",text:"Yet the waves bore the child gently to Seriphos, and there he grew strong. Now set his figure in the Arena. Let his story begin.",note:"Softening to tenderness, then commanding on the last two sentences."},
  olympus_05:{speaker:"ZEUS",text:"So. Perseus stands upon the sands of fate.",note:"Quiet satisfaction. A long pause after 'So.'"},
  thetis_01:{speaker:"THETIS",text:"Mighty Zeus, you cherish your own blood, while my son Calibos crawls through the marshes like a beast!",note:"Sea goddess. Icy, wounded, venom under silk."},
  olympus_06:{speaker:"ZEUS",text:"Your son destroyed my sacred winged horses, all but one. I gave his body the shape of his heart. The judgment stands!",note:"Thunderous. Hard stop on 'stands'.",fx:"shake"},
  thetis_02:{speaker:"THETIS",text:"Then let your precious Perseus wake far from his gentle island, and learn how cruel the world can be.",note:"Sly, whispered menace. She moves his figure."},
  olympus_07:{speaker:"ZEUS",text:"Thetis casts him into peril. Very well. He shall not go unarmed. Hera! Athena! Aphrodite! Bring forth your gifts!",note:"Builds from weary to a great summoning shout.",fx:"shake"},
  olympus_08:{speaker:"ZEUS",text:"Take what the immortals offer, my son. Touch each gift and claim it as your own.",note:"Warm, generous, measured."},
  hera_01:{speaker:"HERA",text:"From Hera, a shield of polished bronze. Keep its face as bright as still water.",note:"Queen of the gods. Regal, knowing; a hint of prophecy on 'still water'."},
  athena_01:{speaker:"ATHENA",text:"From Athena, a helmet. Whoever wears it walks unseen, as the wind walks unseen through the reeds.",note:"Clear, wise, precise."},
  aphrodite_01:{speaker:"APHRODITE",text:"From Aphrodite, a sword forged on Olympus. No mortal blade will ever stand against it.",note:"Warm, radiant, confident."},
  olympus_09:{speaker:"ZEUS",text:"Armed by the gods. Now wake, Perseus, for you wake far from home.",note:"Grand send-off, gentle on the last phrase."},
  // ---- II. Joppa ----
  joppa_01:{speaker:"ZEUS",text:"Thetis has carried you to Joppa, to a theater long abandoned, where weeds grow between the marble seats.",note:"Storyteller cadence, slightly melancholy."},
  joppa_02:{speaker:"ZEUS",text:"Here you meet Ammon, a poet, old and wise in the ways of men. Through him you learn the sorrow of this city.",note:"Fond, unhurried."},
  joppa_03:{speaker:"ZEUS",text:"The Princess Andromeda is cursed. No man may wed her unless he answers a riddle set by Calibos, and every suitor who has failed has paid a terrible price.",note:"Darkening. Weight on 'terrible price'."},
  joppa_04:{speaker:"ZEUS",text:"Each night, while she sleeps, a giant vulture carries her spirit away in a golden cage. Where? That, my son, you must discover.",note:"Mysterious. Let 'Where?' hang in the air."},
  joppa_05:{speaker:"ZEUS",text:"To follow a creature of the sky, you need a steed of the sky. Go to the spring beyond the city, where the moonlight falls.",note:"Commanding counsel."},
  // ---- III. Pegasus ----
  pegasus_01:{speaker:"ZEUS",text:"There he drinks. Pegasus, last of my winged horses. Calibos destroyed his herd, and this one alone remains.",note:"Hushed awe, then grief on 'this one alone'."},
  pegasus_02:{speaker:"ZEUS",text:"He is wild and proud. Seize his bridle and hold fast! Do not let him break free!",note:"Urgent, driving.",fx:"shake"},
  pegasus_fail:{speaker:"ZEUS",text:"He tore free! Patience, my son. Approach him once more, and do not loosen your grip.",note:"Firm but encouraging."},
  pegasus_03:{speaker:"ZEUS",text:"He yields! Pegasus is yours. Mount him, and ride the wind of night!",note:"Exultant. Big.",fx:"shake"},
  pegasus_04:{speaker:"ZEUS",text:"There! The vulture rises from the palace with its golden cage. Spur Pegasus onward. Do not lose it among the clouds!",note:"Excited, pointing, rapid."},
  pegasus_fly_fail:{speaker:"ZEUS",text:"The vulture slips into the clouds! Ride harder, and close the distance.",note:"Sharp, urging."},
  pegasus_05:{speaker:"ZEUS",text:"Well flown! It sinks into the swamp of Calibos. Land softly, and in silence.",note:"Pleased, then dropping to a whisper."},
  // ---- IV. The Swamp ----
  swamp_01:{speaker:"ZEUS",text:"This is the marsh of Calibos: black water, twisted trees, and fires that give no warmth. How will you go forward?",note:"Low and ominous."},
  swamp_open:{speaker:"ZEUS",text:"Hold! Would you march into your enemy's lair for all to see? Use the gift Athena gave you.",note:"A father's sharp rebuke, quickly softening."},
  swamp_02:{speaker:"ZEUS",text:"Now you walk unseen. Watch. Calibos speaks to the captive spirit and gives her a new riddle for the next suitor. Mark every word.",note:"Conspiratorial whisper."},
  swamp_03:{speaker:"ZEUS",text:"Three circles joined, he says. Two pale as the moon, taken from the deep sea. One hollow as a crown, dug from beneath the earth.",note:"Slow, rhythmic, as if reciting an incantation."},
  swamp_04:{speaker:"ZEUS",text:"Ah! The helmet slips from your brow and is lost in the mire. Calibos sees you! Draw Aphrodite's sword!",note:"Sudden alarm. Explosive on 'Calibos sees you!'",fx:"shake"},
  swamp_05:{speaker:"ZEUS",text:"Strike when the spark burns within the gold! Three true blows shall decide this.",note:"Battle command."},
  duel_miss:{speaker:"ZEUS",text:"He turns your blow aside. Again! Watch the gold.",note:"Quick, clipped."},
  swamp_06:{speaker:"ZEUS",text:"A mighty stroke! Calibos loses his hand, and with it his pearl ring. He howls and cowers in the mud.",note:"Triumphant, then a grim note.",fx:"shake"},
  swamp_07:{speaker:"ZEUS",text:"He lies at your mercy. What will you do?",note:"Very quiet. A test."},
  swamp_mercy:{speaker:"ZEUS",text:"You stay your sword and bid him lift his curse. Mercy, my son, is the rarest of all weapons.",note:"Deep pride, warm."},
  swamp_wrath:{speaker:"ZEUS",text:"You drive him howling into the dark. He escapes, and he will not forget.",note:"Neutral, faintly troubled."},
  swamp_08:{speaker:"ZEUS",text:"Take the hand and its ring. And heed me: Thetis watches over her son, and the wrath of a goddess runs deeper than the sea.",note:"Prophetic warning, weighty.",fx:"shake"},
  // ---- V. The Riddle ----
  riddle_01:{speaker:"ZEUS",text:"Morning breaks over Joppa. Queen Cassiopeia presents her daughter once more and asks: is there any man who dares to answer?",note:"Ceremonial."},
  riddle_02:{speaker:"ZEUS",text:"Step forward, prince of Argos. Remember the words of the marsh: two moons from the sea, one crown from the earth. What can it be?",note:"Encouraging, then curious and sly on the question."},
  riddle_wrong:{speaker:"ZEUS",text:"No. Think! Two pearls from the deep, a band of gold from the earth. What holds them together?",note:"Patient teacher."},
  riddle_03:{speaker:"ZEUS",text:"A ring! Two pearls in a circle of gold. And there, upon the hand of Calibos himself, is the proof. The curse is broken. Andromeda shall be your bride!",note:"Triumphant crescendo.",fx:"shake"},
  // ---- VI. The Temple of Thetis ----
  temple_01:{speaker:"ZEUS",text:"The wedding gathers in the temple of Thetis. But Queen Cassiopeia, swollen with pride, declares her daughter more beautiful than Thetis herself.",note:"Foreboding. Disapproving on 'swollen with pride'."},
  temple_02:{speaker:"ZEUS",text:"Foolish queen! In a goddess's own temple! Look. The great statue of Thetis stirs.",note:"Alarmed, then hushed.",fx:"shake"},
  thetis_03:{speaker:"THETIS",text:"Vain mortal! For your boast, and for my son's wound, in thirty days Andromeda shall be given to the Kraken, or Joppa shall be destroyed!",note:"Booming through stone. Cold and immense.",fx:"shake"},
  temple_03:{speaker:"ZEUS",text:"And in that same dark hour, the men of Calibos capture Pegasus. Without wings, how will you face what is coming?",note:"Grave, sorrowful."},
  temple_04:{speaker:"ZEUS",text:"Only the Stygian Witches know how the Kraken may be defeated. Their lair lies far beyond the edge of the known world.",note:"Ancient secret, low."},
  // ---- VII. Bubo ----
  bubo_01:{speaker:"ZEUS",text:"Athena! My son has lost your helmet. Give him your owl, Bubo, wisest of birds, to guide him.",note:"Command to a daughter; firm, kind."},
  athena_02:{speaker:"ATHENA",text:"My Bubo? I will not part with him, Father. But Hephaestus shall forge a likeness, all of gold, with a mind of gears.",note:"Proud refusal, then clever compromise."},
  bubo_02:{speaker:"ZEUS",text:"So be it! See how Hephaestus's work flies down from Olympus. Wake him, Perseus!",note:"Delighted, ringing."},
  bubo_03:{speaker:"ZEUS",text:"Bubo clicks and whirs. He cannot speak as mortals do, so I shall give his gears a voice. Whenever you are lost, call upon him.",note:"Amused, fond, a little playful."},
  // ---- VIII. The Stygian Witches ----
  witch_01:{speaker:"ZEUS",text:"Through mist and stone, Bubo leads you to the lair of the Stygian Witches: three blind sisters who share a single eye.",note:"Creeping, eerie."},
  witch_02:{speaker:"ZEUS",text:"They answer no one freely. How will you win their knowledge?",note:"Challenging."},
  witch_kind:{speaker:"ZEUS",text:"They only cackle and pass the eye along. Courtesy will not move them. You must take what they guard.",note:"Wry."},
  witch_03:{speaker:"ZEUS",text:"The eye passes from hand to hand. When it flies between the sisters, call out to Bubo, and he will snatch it!",note:"Tense instruction."},
  witch_fail:{speaker:"ZEUS",text:"Too slow! The sisters clutch their eye. Watch, and try once more.",note:"Brisk, encouraging."},
  witch_04:{speaker:"ZEUS",text:"Bubo has the eye! Now they must answer. The Kraken can be destroyed by one thing only: the head of the Gorgon Medusa, whose gaze turns every living thing to stone.",note:"The key revelation. Slow and heavy on 'stone'.",fx:"shake"},
  witch_05:{speaker:"ZEUS",text:"Medusa dwells on the Isle of the Dead, across the River Styx, at the very edge of the Underworld. And now, the eye. You promised to return it.",note:"Grim, then a pointed reminder."},
  witch_honor:{speaker:"ZEUS",text:"You place the eye back in their withered hands. A promise kept is honor kept, even with witches.",note:"Approving."},
  witch_toss:{speaker:"ZEUS",text:"You toss it into the dark, and they scrabble, shrieking, among the stones. Clever. But not honorable.",note:"Dry disapproval."},
  // ---- IX. The Styx ----
  styx_01:{speaker:"ZEUS",text:"Before you flows the River Styx, black and silent. Charon, ferryman of the dead, waits with his pole.",note:"Funereal, hushed."},
  styx_02:{speaker:"ZEUS",text:"No one crosses without payment. Place a coin in his bony hand.",note:"Simple, solemn."},
  styx_03:{speaker:"ZEUS",text:"The boat slides through the mist without a ripple. Do not trail your hand in this water, my son.",note:"Protective whisper."},
  // ---- X. Dioskilos ----
  dog_01:{speaker:"ZEUS",text:"Dioskilos! Medusa's two-headed hound guards the gate. Each head strikes in turn. Meet whichever one lunges!",note:"Sudden alarm, battle cry.",fx:"shake"},
  dog_miss:{speaker:"ZEUS",text:"The other head! Watch which jaws open.",note:"Quick."},
  dog_02:{speaker:"ZEUS",text:"The great hound falls. The way into the temple lies open.",note:"Relief, then dread."},
  // ---- XI. Medusa ----
  medusa_01:{speaker:"ZEUS",text:"Firelight flickers within. Medusa was once a beautiful priestess. Now her hair is serpents, her body a serpent's coil, and her eyes are death to all who meet them.",note:"Slow, dreadful storytelling."},
  medusa_02:{speaker:"ZEUS",text:"Hear her rattle in the dark. She carries a bow, and her arrows fly true. How will you enter?",note:"Tense."},
  medusa_charge:{speaker:"ZEUS",text:"An arrow streaks from the dark and glances off your shield! Boldness alone will not serve you here. Choose with wisdom.",note:"Alarm, then counsel.",fx:"shake"},
  medusa_03:{speaker:"ZEUS",text:"Silent as smoke, you slip from pillar to pillar. She is near. Very near. Now, my son, how will you look upon her?",note:"Whisper, slowing, almost holding breath."},
  stone_01:{speaker:"ZEUS",text:"No! You met her gaze, and cold stone creeps over your limbs!",note:"Anguished shout.",fx:"shake"},
  stone_02:{speaker:"ZEUS",text:"Yet the Fates are not done with you. I, Zeus, turn back the moment. Rise, and try again!",note:"Mighty, defiant of fate.",fx:"shake"},
  medusa_04:{speaker:"ZEUS",text:"Wise! Hera's polished shield shows her reflection, and a reflection cannot harm you. Strike only when she is close behind you!",note:"Praise, then precise instruction."},
  medusa_early:{speaker:"ZEUS",text:"Too soon! She slithers back into the shadows. Wait until she is close.",note:"Quick, restraining."},
  medusa_05:{speaker:"ZEUS",text:"Now! One stroke of Aphrodite's sword, and the head of Medusa is yours. Wrap it in your cloak, and never look upon it.",note:"Climactic, then grave warning.",fx:"shake"},
  medusa_06:{speaker:"ZEUS",text:"Her blood is so deadly it eats away Hera's shield. Let it go. Its work is done.",note:"Somber."},
  scorp_01:{speaker:"ZEUS",text:"But Calibos has followed you! He slashes your cloak, Medusa's blood spills on the sand, and from it giant scorpions rise!",note:"Horror, rapid.",fx:"shake"},
  scorp_02:{speaker:"ZEUS",text:"Strike them down! Two blows for each.",note:"Battle command."},
  scorp_03:{speaker:"ZEUS",text:"The scorpions are no more. Calibos, cruel to the last, lashes out with his whip. Your sword answers him, and his wickedness is ended.",note:"Weighty, final."},
  // ---- XII. The Kraken ----
  kraken_01:{speaker:"ZEUS",text:"You turn toward Joppa with the Gorgon's head. But Pegasus is still a prisoner of Calibos's men. Send Bubo to set him free!",note:"Urgent."},
  kraken_02:{speaker:"ZEUS",text:"Faithful Bubo flies! But you, my son, are weary beyond all strength. You stagger into the old theater of Joppa and fall upon the stones.",note:"Tender sorrow."},
  thetis_04:{speaker:"THETIS",text:"Great Zeus, on Earth it is the eve of the longest day. The thirty days are done.",note:"Patient, triumphant cruelty."},
  kraken_03:{speaker:"ZEUS",text:"Release the Kraken!",note:"THE line. Enormous. Commanding. Let it echo; a beat of silence before and after.",fx:"shake"},
  kraken_04:{speaker:"ZEUS",text:"Your clay figure lies fallen in the Arena, my son. Will you rise by your own will alone, or call upon your father?",note:"Quiet, intimate, a father's question."},
  kraken_alone:{speaker:"ZEUS",text:"Proud heart! You stagger and fall again. Even the son of Zeus may ask for help.",note:"Gentle chiding."},
  kraken_05:{speaker:"ZEUS",text:"I hear you. And I set your figure upright in the Arena of Life. Your strength returns, every breath of it. Rise, Perseus!",note:"Rising thunder of love and power.",fx:"shake"},

  kraken_07:{speaker:"ZEUS",text:"Bubo circles the monster's head to distract it, and Pegasus brings you down from the clouds! Unveil the Gorgon's head when the Kraken's eyes meet yours!",note:"Breathless battle narration."},
  kraken_early:{speaker:"ZEUS",text:"Not yet! It does not look at you. Wait for its eyes.",note:"Sharp."},
  kraken_late:{speaker:"ZEUS",text:"Its claw sweeps you into the sea! But Bubo dives and brings back the head. Again!",note:"Shock, then urgency."},
  kraken_08:{speaker:"ZEUS",text:"Behold! The Kraken meets the Gorgon's gaze. Stone creeps over the last of the Titans, and it crumbles into the sea!",note:"Awestruck, colossal.",fx:"shake"},
  kraken_09:{speaker:"ZEUS",text:"Cast the head into the deep, where it will harm no one. Then free Andromeda from her chains!",note:"Victorious command."},

  end_01:{speaker:"ZEUS",text:"Andromeda is free, and Pegasus rises from the waves. Joppa sings your name, Perseus.",note:"Joyful, broad."},
  end_02:{speaker:"ZEUS",text:"So Perseus and Andromeda are wed. They will live long, rule wisely, and fill their halls with children.",note:"Benediction."},
  end_mercy:{speaker:"ZEUS",text:"You showed mercy, kept your word, and were humble enough to call upon the gods. Hear me, all Olympus: no god shall seek vengeance against them. This I forbid!",note:"Supreme decree. Biggest voice of the game.",fx:"shake"},

  end_hard:{speaker:"ZEUS",text:"You won by courage and by strength. Yet a hero who wins without mercy, without his word, without asking help, wins only half a crown.",note:"Stern, loving counsel."},
  end_hard2:{speaker:"ZEUS",text:"Still, I set you both among the stars, Perseus and Andromeda, so the night will remember. Return, and perhaps more stars will shine.",note:"Kindly, with an invitation."},

/* say(id): reveal a voiced line; returns when the player continues. */
let advanceFn = null;
async function say(id, opts={}){
  const g=RUN; const L=VOICE_LINES[id]; if(!L) throw new Error("Missing line "+id);
  clearActions(); setSpeaker(L.speaker); $("#text").innerHTML=""; 
  const voice = await loadVoice(id); chk(g);
  const god = L.speaker!=="";
  let total = Math.min(5200, Math.max(900, L.text.length*30));
  if (L.fx==="shake"){ bolt(opts.power||1.1); } else if (!voice){ if (L.speaker==="ZEUS") SFX.thunder(.35); else SFX.harp(); }
  if (god) SFX.droneOn();
  if (voice){ const d=isFinite(voice.duration)&&voice.duration>0?voice.duration:total/1000; total = Math.max(600,d*900); voice.volume=VOICE_CONFIG.volume; voice.muted=AU.muted; VOICE.current=voice; try{voice.currentTime=0;}catch(e){} voice.play().catch(()=>{}); }
  renderWords(L.text, total);
  const textEl=$("#text"); let revealed=false;
  const revealTimer=setTimeout(()=>{revealed=true;}, total+450);
  await new Promise(res=>{
    const go=()=>{ if (!revealed){ revealed=true; clearTimeout(revealTimer); textEl.classList.add("done"); return; }
      advanceFn=null; res(); };
    advanceFn=go;
    btn(opts.label||"Continue ▸",{cls:"primary full",def:true,onTap:go});
  });
  chk(g); stopVoice(); if (!opts.keepDrone) SFX.droneOff();
}

  return new Promise(res=>{ list.forEach((o,i)=>btn(o.label,{cls:(o.cls||"")+(list.length===1?" full":""),key:String(i+1),def:list.length===1,onTap:()=>{ if(g===RUN){ clearActions(); res(o.k);} }})); });
}

function tapTarget(name, label){
  const g=RUN; clearActions();
  return new Promise(res=>{
    const done=()=>{ if(g!==RUN)return; world().removeEventListener("click",h); clearActions(); res(); };
    const h=e=>{ const t=e.target.closest("[data-act]"); if (t && t.dataset.act===name){ initAudio(); done(); } };
    world().addEventListener("click",h);
    if (label) btn(label,{cls:"primary full",def:true,onTap:done});
  });
}

/* keyboard: Space/Enter = default button / advance; 1-3 = choices */
let holdKeyHandler=null;
document.addEventListener("keydown",e=>{
  initAudio();
  if (holdKeyHandler && (e.code==="Space"||e.code==="Enter")){ e.preventDefault(); holdKeyHandler(true); return; }
  if (e.repeat) return;
  if (e.code==="Space"||e.code==="Enter"){
    e.preventDefault();
    if ($("#card").classList.contains("on") && advanceFn){ advanceFn(); return; }
    const d=$("#actions [data-default]") || ( $("#actions").querySelectorAll("button").length===1 ? $("#actions button") : null);
    if (d && !d.disabled) d.click();
  } else if (/^Digit[1-4]$/.test(e.code)){ const b=$('#actions [data-key="'+e.code.slice(5)+'"]'); if (b) b.click(); }
  else if (e.code==="KeyH" && !$("#hintBtn").hidden) showHint();
  else if (e.code==="KeyM") setMuted(!AU.muted);
});

async function holdGame(){
  const g=RUN; clearActions(); status("Press and HOLD the button until the bar is full.");
  const m=meter(false), bar=m.querySelector("i");
  const b=btn("✋ Hold the bridle!",{cls:"primary full"});
  let holding=false; const on=e=>{ e.preventDefault(); initAudio(); holding=true; b.classList.add("held"); try{b.setPointerCapture(e.pointerId);}catch(_){} };
  const off=()=>{ holding=false; b.classList.remove("held"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off); b.addEventListener("pointercancel",off); b.addEventListener("lostpointercapture",off);
  b.addEventListener("contextmenu",e=>e.preventDefault());
  holdKeyHandler=v=>{ holding=v; b.classList.toggle("held",v); };
  let p=0, t=0, peak=0, result=null, lastFlap=0; const peg=el("peg");
  await loop(dt=>{ t+=dt; const rear=(t%2.4)>1.6;
    if (holding){ p+=dt*(rear?.1:.32); } else p-=dt*.3; p=Math.max(0,Math.min(1,p)); peak=Math.max(peak,p);
    if (peg) peg.setAttribute("transform", rear ? "translate(250,300) rotate(-14)" : "translate(250,300)");
    if (rear && t-lastFlap>.45){ SFX.flap(); lastFlap=t; }
    status(rear?"He rears up! Hold fast!":(holding?"Steady... steady...":"Press and HOLD the button!"));
    bar.style.width=(p*100)+"%";
    if (p>=1){ result=true; return true; }
    if (!holding && peak>.3 && p<=0){ result=false; return true; }
    return false; });
  holdKeyHandler=null; chk(g); return result;
}

async function timingGame(o){ // generic: needle ping-pong, need o.hits successes

  btn(o.label,{cls:"primary full",def:true,onTap:()=>{ if (lock>0) return; const inZone = x>=.41 && x<=.59;

  const boat=(x,coin)=>bgStyx(`<g id="boatwrap"><g transform="translate(${x},300)">${charon(0,0,1)}${perseus(40,-2,.8,{sword:true})}${bubo(70,-30,.6)}</g></g>`+(coin?`<g data-act="coin" class="tap" transform="translate(300,200)"><circle r="44" fill="#000" opacity="0"/><circle r="40" class="tap-ring"/><circle r="18" fill="url(#gGold)" stroke="#7a5410" stroke-width="3" class="glowp"/><text y="6" text-anchor="middle" font-size="16" fill="#7a5410" font-family="Georgia,serif">Ω</text></g>`:""));
  scene(boat(150,false)); SFX.sea(4); await say("styx_01"); scene(boat(150,true)); await say("styx_02");
  plain("Tap the coin to pay Charon.",""); await tapTarget("coin","🪙 Pay the ferryman"); SFX.coin();
  scene(boat(150,false)); const b=el("boatwrap");
  if (b){ b.style.transition="transform 4s steps(16)"; requestAnimationFrame(()=>requestAnimationFrame(()=>{ b.style.transform="translateX(120px)"; })); }
  SFX.sea(5); await say("styx_03");
}
async function chDog(){
  await card("X","The Isle of the Dead"); S.hintKey="dog";
  scene(bgIsle(dog(240,320,1.2)+perseus(90,340,1.2,{swordUp:true}))); SFX.growl(); SFX.growl();
  await say("dog_01",{power:1.3});
  await dogGame(); SFX.thunder(.8);
  scene(bgIsle(`<g transform="translate(240,340) rotate(8)" opacity=".7">${dog(0,0,1.1)}</g>`+perseus(110,340,1.2)));
  await say("dog_02");
}
async function chMedusa(){
  await card("XI","Medusa"); S.hintKey="medusa_enter";
  scene(bgLair(medusa(250,260,.95,{flip:true,cls:"bob"})+`<rect x="200" y="160" width="140" height="140" fill="#000" opacity=".35"/>`+perseus(90,340,1.15)));
  SFX.rattle(); SFX.hiss(); await say("medusa_01"); await say("medusa_02");
  for(;;){ const c=await choose([{k:"charge",label:"🚪 Charge through the doors",cls:"danger"},{k:"creep",label:"🌑 Creep through the shadows",cls:"primary"}],"How will you enter?");
    if (c==="creep") break; S.retries++; SFX.whoosh(); SFX.clang(); await say("medusa_charge"); }
  // checkpoint: the gaze
  for(;;){
    S.hintKey="medusa_look";
    scene(bgLair(`<g opacity=".9">${medusa(230,270,1,{flip:true,cls:"bob"})}</g>`+`<g id="pers">${perseus(110,350,1.2)}</g>`));
    SFX.rattle(); await say("medusa_03");
    const c=await choose([{k:"look",label:"👁️ Look at her directly",cls:"danger"},{k:"shield",label:"🛡️ Watch her in the shield",cls:"primary"}],"How will you look upon her?");
    if (c==="look"){
      S.stoned++; S.retries++; SFX.hiss(); SFX.stone();
      scene(bgLair(medusa(230,270,1,{flip:true})+`<g class="stone">${perseus(110,350,1.2)}</g>`+`<rect x="-300" y="-400" width="1000" height="1200" fill="#7a7a6a" opacity=".25"/>`));
      await say("stone_01",{power:1.3}); await say("stone_02",{power:1.5}); continue;
    }
    S.hintKey="medusa_strike";
    scene(bgLair(`<rect x="-300" y="-400" width="1000" height="1200" fill="#000" opacity=".45"/>`
      +shieldMirror(200,190,120,`<rect x="-150" y="-150" width="300" height="300" fill="#2a1a0a"/>${fire(-80,10,.8)}${column(80,-120,240,22)}<g id="mref" transform="scale(.5)">${medusa(-20,60,1.1,{cls:"bob"})}</g>`)
      +`<g transform="translate(200,360)"><path d="M-30,40 Q-26,-10 0,-14 Q26,-10 30,40Z" fill="#9c2f1f"/><circle cy="-26" r="16" fill="#3a2414"/><path d="M-24,-10 q-30,-30 -40,-80 M24,-10 q30,-30 40,-80" stroke="#c98d5c" stroke-width="10" stroke-linecap="round" fill="none"/></g>`));
    await say("medusa_04");
    let won=false;
    for(;;){ const ok=await mirrorGame(); if (ok){ won=true; break; } S.retries++; SFX.hiss(); await say("medusa_early"); }
    if (won) break;
  }
  SFX.clang(); bolt(1.4);
  scene(bgLair(medusaHead(200,170,1.6)+perseus(200,350,1.3,{swordUp:true,shield:false})));
  await say("medusa_05",{power:1.4});
  scene(bgLair(`<path d="M160,330 q40,-16 80,0 q-40,16 -80,0Z" fill="#3a6a2a"/><g transform="translate(200,320)" opacity=".6"><circle r="15" fill="url(#gShield)"/></g>`+perseus(110,340,1.2,{shield:false})));
  SFX.hiss(); await say("medusa_06");
  // scorpions
  S.hintKey="scorp";
  scene(sky("#101830","#050812")+stars(30,13,200)+ground(270,"#2a2418")+fire(330,250,.7)+calibos(330,300,.9,{flip:true,noHand:true})+perseus(70,250,1,{shield:false,swordUp:true})+`<path d="M150,300 q30,-12 60,0 q-30,12 -60,0Z" fill="#5a1a1a" opacity=".7"/>`);
  SFX.growl(); await say("scorp_01",{power:1.3});
  scene(sky("#101830","#050812")+stars(30,13,200)+ground(250,"#2a2418")+fire(360,236,.6)+perseus(60,240,1,{shield:false,swordUp:true})+scorpion(90,300,.9,"sc1")+scorpion(200,330,1.05,"sc2")+scorpion(310,300,.9,"sc3"));
  SFX.hiss(); await say("scorp_02");
  await scorpGame();
  scene(sky("#101830","#050812")+stars(30,13,200)+ground(270,"#2a2418")+fire(330,250,.7)+perseus(160,300,1.2,{shield:false}));
  await say("scorp_03");
}
async function chKraken(){
  await card("XII","The Kraken"); S.hintKey="kraken_send";
  scene(bgSwamp(perseus(90,330,1.1,{shield:false})+bubo(170,290,1,{act:"bsend"})+`<g transform="translate(300,250)">${pegasus(0,0,.8,{still:true})}</g>`));
  await say("kraken_01");
  plain("Tap Bubo to send him.",""); await tapTarget("bsend","🦉 Send Bubo!"); SFX.whir(); SFX.click();
  scene(bgJoppa(`<g transform="translate(200,330) rotate(80)">${perseus(0,0,1.1,{shield:false})}</g>`)); SFX.flap();
  await say("kraken_02");
  scene(bgOlympus(figurine(200,330,1.1,true)+`<g transform="translate(320,240)"><circle cy="-40" r="12" fill="#cfe"/><path d="M-16,-28 h32 l6,60 h-44Z" fill="#5ab0a0"/></g>`));
  await say("thetis_04"); SFX.roar(); await say("kraken_03",{power:2});
  S.hintKey="kraken_call";
  await say("kraken_04");
  const c=await choose([{k:"call",label:"⚡ Call upon Zeus",cls:"primary"},{k:"alone",label:"💪 Rise by my own will",cls:"alt"}],"Your figure lies fallen.");
  S.humble = c==="call";
  if (!S.humble){ SFX.hit(); await say("kraken_alone"); await choose([{k:"call",label:"⚡ Call upon Zeus",cls:"primary"}],"Ask for help."); }
  scene(bgOlympus(figurine(200,326,1.1)+`<circle cx="200" cy="300" r="50" fill="url(#gGlow)" class="glowp"/>`)); SFX.chime();
  await say("kraken_05",{power:1.4});
  // the sea cliffs
  S.hintKey="kraken";
  const cliffs=(ky,extra="")=>bgCliffs(`<g transform="translate(340,262)">${andromeda(0,0,.8,{chained:true})}</g>`+kraken({y:ky})+extra);
  scene(cliffs(470)); SFX.sea(6); SFX.roar();
  // stepped, stop-motion style rise
  await (async()=>{ for(let i=0;i<=10;i++){ const k=el("kraken"); if(k) k.setAttribute("transform",`translate(200,${470-i*22})`); await sleep(120);} })();
  await say("kraken_06",{power:1.6});
  const battle=()=>scene(cliffs(250,`<g transform="translate(70,110)"><g class="bob">${pegasus(0,0,.75,{fly:true})}${perseus(4,-12,.6,{shield:false})}</g></g>`+`<g transform="translate(300,80)">${bubo(0,0,.7,{fly:true})}</g>`));
  battle(); SFX.flap(); SFX.whir(); await say("kraken_07");
  for(;;){ const r=await krakenGame(); if (r==="hit") break; S.retries++;
    if (r==="early"){ SFX.roar(); await say("kraken_early"); } else { SFX.splash(); SFX.roar(); await say("kraken_late"); } battle(); }
  // petrify
  bolt(1.6); SFX.hiss(); SFX.stone();
  scene(cliffs(250,medusaHead(90,120,1)+`<g transform="translate(70,190)"><g class="bob">${pegasus(0,0,.6,{fly:true})}</g></g>`));
  const k=el("kraken"); k.classList.add("stone");
  await say("kraken_08",{power:2});
  for(let i=0;i<=8;i++){ k.setAttribute("transform",`translate(200,${250+i*28}) rotate(${i*2})`); await sleep(110); } SFX.splash(); SFX.sea(4);
  await say("kraken_09");
}
async function chEnding(){
  await card("XIII","Among the Stars");
  scene(bgCliffs(`<g transform="translate(200,300)"><g class="bob">${pegasus(0,0,1,{fly:true})}</g></g>`+`<g transform="translate(330,262)">${andromeda(0,0,.8)}</g>`+perseus(290,270,.8,{shield:false})));
  SFX.fanfare(); await say("end_01");
  scene(bgTemple(andromeda(175,330,1)+perseus(225,340,1.1,{shield:false})+[0,1,2,3,4,5].map(i=>`<circle cx="${60+i*56}" cy="${240+(i%2)*14}" r="5" fill="#ffb3c4" class="tw"/>`).join("")));
  SFX.harp(); await say("end_02");
  const virtue=(S.mercy?1:0)+(S.honor?1:0)+(S.humble?1:0); const great=virtue>=2;
  const P=constellation([[60,60],[84,84],[108,70],[92,112],[74,140],[112,142]],[[0,1],[1,2],[1,3],[3,4],[3,5]],"PERSEUS",88,170,"glowp");
  const A=constellation([[240,60],[270,78],[300,92],[332,110],[300,124]],[[0,1],[1,2],[2,3],[2,4]],"ANDROMEDA",290,150,"glowp");
  const G=constellation([[110,220],[190,214],[196,276],[116,282],[70,250]],[[0,1],[1,2],[2,3],[3,0],[0,4]],"PEGASUS",150,306);
  const C=constellation([[230,250],[256,284],[280,256],[306,290],[334,252]],[[0,1],[1,2],[2,3],[3,4]],"CASSIOPEIA",282,320);
  scene(bgNightSky(P+A+(great?G+C:"")+zeusFace(200,372,.7)));
  SFX.chime();
  if (great){ await say("end_mercy",{power:1.6}); await say("end_mercy2"); } else { await say("end_hard"); await say("end_hard2"); }
  SFX.fanfare(); await say("end_03",{power:1.2,label:"See your legend ▸"});
  // summary
  const row=(ok,a,b)=>`<div>${ok?"✦":"✧"} ${ok?a:b}</div>`;
  plain(`<div style="text-align:center;color:var(--gold);letter-spacing:.12em">${great?"THE LEGEND OF PERSEUS":"A HERO'S FIRST TALE"}</div>
   <div style="font-size:.85em;margin-top:6px">${row(S.mercy,"You spared Calibos","You drove Calibos away")}${row(S.honor,"You kept your word to the witches","You tossed away the witches' eye")}${row(S.humble,"You called upon Zeus","You tried to rise alone")}
   <div class="sub">Second chances from Zeus: ${S.retries} · Times turned to stone: ${S.stoned} · Bubo's hints: ${S.hints}</div>
   ${great?"":`<div class="sub">Try mercy, honor and humility for the full ending.</div>`}</div>`,"");
  await choose([{k:"again",label:"⚡ Play Again",cls:"primary bolt"}]);
}
async function main(){
  RUN++; const g=RUN; resetState(); stopVoice(true); SFX.droneOff(); $("#toast").classList.remove("on");
  try{
    await titleScreen(); await chOlympus(); await chJoppa(); await chPegasus(); await chSwamp(); await chRiddle(); await chTemple();
    await chBubo(); await chWitches(); await chStyx(); await chDog(); await chMedusa(); await chKraken(); await chEnding();
    if (g===RUN) main();
  } catch(e){ if (!(e instanceof Abort)) { console.error(e); } }
}
/* test hook: lets automated tests jump to a chapter (not used in normal play) */
window.__cott = { S, jump: async name=>{ RUN++; resetState(); S.bubo=true; $("#hintBtn").hidden=false; $("#hintBtn").innerHTML=buboIcon(); const fns={olympus:chOlympus,joppa:chJoppa,pegasus:chPegasus,swamp:chSwamp,riddle:chRiddle,temple:chTemple,bubo:chBubo,witches:chWitches,styx:chStyx,dog:chDog,medusa:chMedusa,kraken:chKraken,ending:chEnding}; const g=RUN; try{ await fns[name](); }catch(e){ if(!(e instanceof Abort)) console.error(e);} } };
setMuted(AU.muted);
main();
</script>
